<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3FA8F4">
<title>Savory · ¿Qué tal tu experiencia?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Montserrat:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="../css/movil.css?v=11">
<style>
/* Según el Brand Guidelines de Savory (2021): celeste Savory #3FA8F4 como color principal, secundarios en pares
   (Combinatoria), fondos crema, formas curvas tipo ola, íconos planos en blanco, títulos anchos (Agrandir,
   aquí Unbounded como equivalente libre) y texto en Montserrat. */
:root {
  --celeste: #3FA8F4; --azul: #303AB2; --morado: #6E3FA3; --naranjo: #FF6720; --verde: #009739; --arena: #EED484;
  --celeste-claro: #BBE5FF; --lila: #D2B3FF; --rosado: #F5D5E5; --menta: #B3FFC3; --durazno: #FFC6AE; --crema: #F8F5EF;
  --fondo: var(--celeste); --hoja: transparent; --tarjeta: #FFFFFF; --texto: #1B1F5E; --texto-suave: #4A4F7A; --titulo: var(--azul);
  --primario: var(--azul); --sobre-primario: #FFFFFF; --borde: transparent; --sel-fondo: var(--celeste-claro); --ofertas-fondo: #FFFFFF;
  --cab-fondo: transparent; --cab-texto: #FFFFFF; --progreso-vacio: rgba(255, 255, 255, 0.5);
  --fuente: 'Montserrat', system-ui, sans-serif; --fuente-titulo: 'Unbounded', 'Montserrat', sans-serif; --fuente-boton: 'Montserrat', system-ui, sans-serif;
  --peso-titulo: 700; --mayus: none; --espaciado-titulo: -0.5px; --mayus-boton: none; --espaciado-boton: 0;
  --radio: 24px; --radio-chip: 999px; --radio-boton: 999px; --radio-campo: 16px;
  /* Par de colores de cada pantalla (se cambia abajo según el paso) */
  --par-1: var(--azul); --par-2: var(--menta);
}
body:has(.chips) { --par-1: var(--naranjo); --par-2: var(--durazno); }
body:has(.ofertas) { --par-1: var(--morado); --par-2: var(--lila); }
body:has(.gracias) { --par-1: var(--verde); --par-2: var(--rosado); }

/* Cabecera celeste con dos formas curvas del par de colores y un ícono plano blanco */
.cab { position: relative; overflow: hidden; padding: 18px 16px 52px; background: var(--celeste); }
.cab::before { content: ''; position: absolute; right: -70px; top: -90px; width: 230px; height: 230px; border-radius: 50%; background: var(--par-1); }
.cab::after { content: ''; position: absolute; left: -40px; bottom: -70px; width: 220px; height: 130px; border-radius: 0 120px 0 0; background: var(--par-2); }
.cab > * { position: relative; z-index: 1; }
.logo-sv { display: block; width: 104px; height: 84px; }
.icono { position: absolute; z-index: 1; right: 26px; bottom: 16px; width: 26px; height: 52px; transform: rotate(14deg); }
.progreso span.lleno { background: #FFFFFF; }

/* Hoja crema con la esquina curva grande, como los layouts del manual */
.cuerpo { position: relative; z-index: 2; margin-top: -28px; padding-top: 28px; background: var(--crema); border-radius: 44px 44px 0 0; }
.pie { background: var(--crema); }
h1 { font-size: 26px; line-height: 1.15; }
h1 .acento, h2 .acento { color: var(--naranjo); }
.cara-fila { background: #FFFFFF; border: 2px solid #FFFFFF; font-weight: 700; color: var(--texto); }
.cara-fila:active, .cara-fila.tocado { background: var(--celeste-claro); border-color: var(--celeste); }
.chip { background: #FFFFFF; border: 2px solid #FFFFFF; font-weight: 700; color: var(--texto); }
.chip.sel { background: var(--azul); border-color: var(--azul); color: #FFFFFF; }
.principal { font-weight: 800; font-size: 18px; }
.ofertas { border-radius: 28px; }
.ofertas h2 { font-size: 19px; line-height: 1.2; }
textarea, input[type="text"], input[type="email"] { background: #FFFFFF; border-color: #FFFFFF; }
textarea:focus, input:focus { border-color: var(--celeste); }
.ofertas input[type="text"], .ofertas input[type="email"] { background: var(--crema); border-color: var(--crema); }

/* Gracias: bloque celeste con paleta blanca, como el cierre del manual */
.gracias h1 { font-size: 36px; color: var(--azul); }
.bloque-gracias { position: relative; width: 210px; height: 230px; border-radius: 40px 40px 40px 0; background: var(--celeste); overflow: hidden; }
.bloque-gracias::before { content: ''; position: absolute; left: -50px; bottom: -60px; width: 200px; height: 120px; border-radius: 0 110px 0 0; background: var(--par-2); }
.bloque-gracias::after { content: ''; position: absolute; right: -50px; top: -50px; width: 130px; height: 130px; border-radius: 50%; background: var(--par-1); }
.bloque-gracias svg { position: absolute; z-index: 1; left: 50%; top: 50%; width: 64px; height: 128px; transform: translate(-50%, -50%) rotate(-10deg); }
</style>
</head>
<body>
<div id="app"></div>
<script>
// Paleta plana en blanco, al estilo de la iconografía de Savory
const PALETA = '<svg viewBox="0 0 60 120" aria-hidden="true"><path d="M8 32 Q8 4 30 4 Q52 4 52 32 V82 Q52 90 44 90 H16 Q8 90 8 82 Z" fill="#FFFFFF"/><rect x="24" y="88" width="12" height="30" rx="6" fill="#FFFFFF"/></svg>';
window.MARCA = {
  clave: 'Savory', nombre: 'Savory',
  logo: '<img class="logo-sv" src="../img/marcas/savory-logo.webp" alt="Savory">' + PALETA.replace('<svg ', '<svg class="icono" '),
  imagen: '<div class="bloque-gracias">' + PALETA + '</div>',
  textos: {
    pregunta: '¿Qué tal fue tu <span class="acento">experiencia</span> hoy?', positiva: '¡Qué rico! ¿Qué fue <span class="acento">lo mejor?</span>',
    neutra: '¿Qué podríamos <span class="acento">hacer mejor?</span>', negativa: 'Lo sentimos. <span class="acento">¿Qué falló?</span>',
    ofertas: '¿Quieres recibir <span class="acento">ofertas y descuentos?</span>', gracias: '¡Gracias!'
  },
  gusto: ['Sabor del helado', 'Variedad de sabores', 'Textura y temperatura', 'Atención del personal', 'Rapidez', 'Limpieza del local'],
  mejorar: ['Sabor del helado', 'Pocos sabores disponibles', 'Textura o temperatura', 'Atención del personal', 'Demora en la atención', 'Limpieza del local']
};
</script>
<script src="../js/config.js?v=11"></script>
<script src="../js/politica.js?v=11"></script>
<script src="../js/movil.js?v=12"></script>
</body>
</html>
