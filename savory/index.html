<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3FA8F4">
<title>Savory · ¿Qué tal tu experiencia?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="../css/movil.css?v=11">
<style>
:root {
  --fondo: #3FA8F4; --hoja: transparent; --tarjeta: #F2F9FF; --texto: #212773; --texto-suave: #4A5394; --titulo: #212773;
  --primario: #303AB2; --sobre-primario: #FFFFFF; --borde: #CFEAFF; --sel-fondo: #E3F2FF; --ofertas-fondo: #F2F9FF;
  --cab-fondo: transparent; --cab-texto: #FFFFFF; --progreso-vacio: rgba(255, 255, 255, 0.45);
  --fuente: 'Montserrat', system-ui, sans-serif; --fuente-titulo: 'Montserrat', system-ui, sans-serif; --fuente-boton: 'Montserrat', system-ui, sans-serif;
  --peso-titulo: 900; --mayus: none; --espaciado-titulo: -0.3px; --mayus-boton: none; --espaciado-boton: 0;
  --radio: 22px; --radio-chip: 999px; --radio-boton: 999px; --radio-campo: 14px;
}
/* Cielo celeste con burbujas suaves, como savory.cl */
body {
  background:
    radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.28) 0 38px, transparent 39px),
    radial-gradient(circle at 88% 4%, rgba(255, 255, 255, 0.18) 0 60px, transparent 61px),
    radial-gradient(circle at 70% 22%, rgba(255, 255, 255, 0.16) 0 16px, transparent 17px),
    linear-gradient(180deg, #5DBDF8 0%, #3FA8F4 45%, #2F95E6 100%);
  background-attachment: fixed;
}
.cab { position: relative; padding: 18px 16px 44px; }
.logo-sv { display: block; width: 112px; height: 90px; filter: drop-shadow(0 4px 8px rgba(17, 40, 120, 0.25)); }
.progreso span.lleno { background: #FFFFFF; }
.deco { position: absolute; bottom: 18px; z-index: 0; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(17, 40, 120, 0.2)); }
.deco-izq { left: max(72px, calc(50% - 128px)); width: 34px; transform: rotate(-14deg); }
.deco-der { right: max(72px, calc(50% - 132px)); width: 42px; transform: rotate(12deg); }

/* Hoja blanca que sube sobre el cielo, con bordes redondeados */
.cuerpo { position: relative; z-index: 1; margin-top: -16px; padding-top: 26px; background: #FFFFFF; border-radius: 34px 34px 0 0; box-shadow: 0 -8px 24px rgba(17, 40, 120, 0.14); }
.pie { background: #FFFFFF; }
h1 .rojo, h2 .rojo { color: #E30613; }
h1 { font-size: 29px; }

.cara-fila { border-color: transparent; background: var(--tarjeta); box-shadow: 0 2px 0 #D8EEFF; }
.cara-fila:active, .cara-fila.tocado { border-color: var(--primario); background: var(--sel-fondo); }
.chip { border-color: var(--borde); background: var(--tarjeta); color: var(--texto); }
.chip.sel { border-color: var(--primario); background: var(--primario); color: #FFFFFF; box-shadow: 0 4px 10px rgba(48, 58, 178, 0.3); }
.principal { min-height: 58px; box-shadow: 0 6px 14px rgba(48, 58, 178, 0.32); font-weight: 800; }
.principal:disabled { box-shadow: none; }
.ofertas { border: 2px dashed #BFE2FF; }
textarea, input[type="text"], input[type="email"] { background: #FFFFFF; }

.gracias h1 { font-size: 40px; }
.gracias .imagen { width: 170px; height: auto; max-height: none; filter: drop-shadow(0 8px 14px rgba(17, 40, 120, 0.18)); }
</style>
</head>
<body>
<div id="app"></div>
<script>
// Ilustraciones simples de helado (paleta y cono) para acompañar el logo

window.MARCA = {
  clave: 'Savory', nombre: 'Savory',
  logo: PALETA + '<img class="logo-sv" src="../img/marcas/savory-logo.webp" alt="Savory">' + CONO,
  imagen: COPA,
  textos: {
    pregunta: '¿Qué tal fue tu <span class="rojo">experiencia</span> hoy?', positiva: '¡Qué rico! ¿Qué fue <span class="rojo">lo mejor?</span>',
    neutra: '¿Qué podríamos <span class="rojo">hacer mejor?</span>', negativa: 'Lo sentimos. <span class="rojo">¿Qué falló?</span>',
    ofertas: '¿Quieres recibir <span class="rojo">ofertas y descuentos?</span>', gracias: '¡Gracias!'
  },
  gusto: ['Sabor del helado', 'Variedad de sabores', 'Textura y temperatura', 'Atención del personal', 'Rapidez', 'Limpieza del local'],
  mejorar: ['Sabor del helado', 'Pocos sabores disponibles', 'Textura o temperatura', 'Atención del personal', 'Demora en la atención', 'Limpieza del local']
};
</script>
<script src="../js/config.js?v=11"></script>

</body>
</html>
