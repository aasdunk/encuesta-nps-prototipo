<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Dunkin · Flujo propuesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=6">
<style>
.logo-dk { position: absolute; width: 170px; height: 36px; overflow: hidden; }
.logo-dk img { position: absolute; left: 0; top: -11px; width: 260px; height: 57px; }
.opcion { height: 104px; border-radius: 20px; border: 2px solid #E7DCD6; background: #FFFFFF; font-size: 24px; font-weight: 600; color: #4A2C22; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px; text-align: left; }
.opcion.sel { background: #E8178A; border-color: #E8178A; color: #FFFFFF; }
.opcion .check { display: none; }
.opcion.sel .check { display: block; }
.circulo { width: 94px; height: 94px; border-radius: 999px; border: none; font-size: 42px; font-weight: 700; color: #FFFFFF; }
</style>
</head>
<body>
<div id="escenario" style="color: #4A2C22"></div>
<script src="js/config.js?v=6"></script>
<script src="js/comun.js?v=6"></script>
<script>
const MEJORAR = ['Rapidez de atención', 'Amabilidad del personal', 'Calidad del producto', 'Limpieza del local', 'Pedido incompleto o incorrecto', 'Otro motivo'];
const GUSTO = ['Rapidez de atención', 'Amabilidad del personal', 'Calidad del producto', 'Limpieza del local', 'Variedad de productos', 'Otro motivo'];
const NPS_COLORES = ['#A10E2B', '#C3201F', '#D9271C', '#EE3418', '#FF3A12', '#FF3E0D', '#FF5A0A', '#FF8C00', '#E6C200', '#22C42E', '#0BAF2A'];
const PASOS = ['Experiencia', 'Tipo de cliente', 'Seguimiento', 'NPS', 'Comentario', 'Ofertas', 'Gracias'];
const GRACIAS = 6;

const escenario = document.getElementById('escenario');
let estado;
function reiniciarEstado() {
  estado = { paso: 0, hist: [], reg: nuevoRegistro('Dunkin', 'Propuesto'), exp: null, sel: {}, comentario: '' };
}
function ir(n) {
  estado.hist.push(estado.paso);
  estado.paso = n;
  estado.reg.ultimo_paso = PASOS[n];
  if (n === GRACIAS) terminar(true);
  pintar();
}
function volver() { if (estado.hist.length) { estado.paso = estado.hist.pop(); pintar(); } }
function terminar(completa) {
  const lista = estado.exp !== null && estado.exp <= 1 ? GUSTO : MEJORAR;
  const elegidos = lista.filter((o, i) => estado.sel[i]);
  estado.reg.motivos = elegidos.length ? (estado.exp <= 1 ? 'Gustó: ' : 'Mejorar: ') + elegidos.join(', ') : '';
  estado.reg.comentario = estado.comentario;
  estado.reg.completada = completa;
  enviarRegistro(estado.reg);
}

const logo = (x, y) => `<div class="logo-dk" style="left: ${x}px; top: ${y}px"><img src="img/marcas/dunkin-logo-productos.png" alt="Dunkin"></div>`;
const botonVolver = '<button class="volver-dk" data-accion="volver">VOLVER</button>';
const menu = '<a class="menu-link" href="index.html">Menú del prototipo</a>';

let temporizadorGracias = null;
function pintar() {
  clearTimeout(temporizadorGracias);
  const n = estado.paso;
  let html = '';
  if (n === 0) {
    html = `
      <img class="abs" src="img/productos/05-cafe-crema-chocolate.png" alt="" style="left: -70px; top: -150px; width: 300px">
      <img class="abs" src="img/productos/03-dona-sonrisa.png" alt="" style="right: -90px; bottom: -80px; width: 320px; transform: rotate(-14deg)">
      <div class="abs" style="right: 40px; top: 36px; width: 260px; height: 55px; overflow: hidden"><img src="img/marcas/dunkin-logo-productos.png" alt="Dunkin" style="position: absolute; left: 0; top: -17px; width: 398px; height: 88px"></div>
      <div class="pantalla" style="display: flex; flex-direction: column; align-items: center; padding-top: 150px">
        <h1 style="margin: 0 0 48px; max-width: 960px; font-size: 84px; line-height: 1.02; font-weight: 700; color: #F26B0F; text-align: center">¿CÓMO FUE TU EXPERIENCIA HOY?</h1>
        <div style="display: flex; gap: 64px">
          ${CARAS.map((c, i) => `<button class="cara" data-cara="${i}" aria-label="${c}">${caraSVG(i, 170)}<span style="font-size: 18px; font-weight: 700; color: #E8178A; text-transform: uppercase">${c}</span></button>`).join('')}
        </div>
      </div>`;
  } else if (n === 1) {
    html = `${logo(40, 28)}${botonVolver}
      <img class="abs" src="img/productos/06-croissant.png" alt="" style="left: -90px; bottom: -70px; width: 430px">
      <img class="abs" src="img/productos/01-bebida-rosada.png" alt="" style="right: -40px; bottom: -50px; height: 430px">
      <div class="pantalla centro">
        <h1 style="margin: 0 0 48px; font-size: 58px; line-height: 1.1; font-weight: 700; color: #F26B0F; text-align: center">Selecciona la opción<br>que mejor te identifica</h1>
        <div style="display: flex; gap: 32px">
          <button data-tipo="Cliente" style="width: 380px; height: 120px; border: none; border-radius: 24px; background: #E8178A; font-size: 38px; font-weight: 700; color: #FFFFFF">SOY CLIENTE</button>
          <button data-tipo="Delivery" style="width: 380px; height: 120px; border: none; border-radius: 24px; background: #F26B0F; font-size: 38px; font-weight: 700; color: #FFFFFF">SOY DELIVERY</button>
        </div>
      </div>`;
  } else if (n === 2) {
    const positivo = estado.exp <= 1;
    const lista = positivo ? GUSTO : MEJORAR;
    html = `${logo(40, 28)}${botonVolver}
      <div class="pantalla centro" style="padding: 70px 120px 40px">
        <h1 style="margin: 0; font-size: 50px; line-height: 1.1; font-weight: 700; text-align: center"><span style="color: #F26B0F">${positivo ? '¡Qué bueno!' : 'Cuéntanos qué pasó.'}</span> <span style="color: #E8178A">${positivo ? '¿Qué fue lo que más te gustó?' : '¿Qué podemos mejorar?'}</span></h1>
        <p style="margin: 10px 0 0; font-size: 22px; font-weight: 500; color: #7A5A4E">Puedes elegir más de una opción</p>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 36px; width: 1040px">
          ${lista.map((o, i) => `<button class="opcion${estado.sel[i] ? ' sel' : ''}" data-opcion="${i}" aria-pressed="${!!estado.sel[i]}"><span>${o}</span><svg class="check" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#FFFFFF"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#E8178A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`).join('')}
        </div>
        <div style="width: 1040px; display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 40px">
          <button data-accion="siguiente" style="height: 64px; padding: 0 24px; border: none; background: transparent; font-size: 22px; font-weight: 600; color: #4A2C22; text-decoration: underline">Omitir</button>
          <button data-accion="siguiente" style="height: 72px; padding: 0 52px; border: none; border-radius: 16px; background: #E8178A; font-size: 26px; font-weight: 700; color: #FFFFFF">Continuar</button>
        </div>
      </div>`;
  } else if (n === 3) {
    html = `${logo(40, 28)}${botonVolver}
      <div class="pantalla centro" style="padding-top: 40px">
        <h1 style="margin: 0 0 64px; max-width: 1100px; font-size: 64px; line-height: 1.1; font-weight: 700; color: #CC3366; text-align: center">¿Recomendarías <span style="color: #F26B0F">DUNKIN'</span> a algún amigo o familiar?</h1>
        <div style="width: 1196px; display: flex; justify-content: space-between; margin-bottom: 12px">
          <span style="background: #E8178A; color: #FFFFFF; border-radius: 12px; padding: 8px 16px; font-size: 18px; font-weight: 700; text-align: center; line-height: 1.1">No<br>recomendaría</span>
          <span style="background: #F26B0F; color: #FFFFFF; border-radius: 12px; padding: 8px 16px; font-size: 18px; font-weight: 700; text-align: center; line-height: 1.1">Recomendaría<br>totalmente</span>
        </div>
        <div style="display: flex; gap: 16px">
          ${NPS_COLORES.map((c, i) => `<button class="circulo" data-nps="${i}" style="background: ${c}">${i}</button>`).join('')}
        </div>
      </div>`;
  } else if (n === 4) {
    html = `
      <div class="pantalla" style="background: #CB2F63; color: #FFFFFF">
        <img class="abs" src="img/productos/02-cafe-caliente.png" alt="" style="right: -40px; bottom: -60px; height: 520px">
        <div class="abs" style="left: 40px; top: 24px; background: #FFFFFF; border-radius: 12px; padding: 6px 12px"><div style="width: 170px; height: 36px; overflow: hidden; position: relative"><img src="img/marcas/dunkin-logo-productos.png" alt="Dunkin" style="position: absolute; left: 0; top: -11px; width: 260px; height: 57px"></div></div>
        <button class="volver-dk" data-accion="volver">VOLVER</button>
        <div class="abs" style="left: 80px; top: 150px; width: 820px; display: flex; flex-direction: column; gap: 24px">
          <label for="comentario" style="font-size: 56px; line-height: 1.08; font-weight: 700">¡Ayúdanos a mejorar!<br>¿Algún comentario?</label>
          <textarea id="comentario" class="campo" maxlength="300" style="position: static; width: 820px; height: 190px; font-size: 26px; color: #4A2C22">${escaparHTML(estado.comentario)}</textarea>
          <div style="display: flex; gap: 16px">
            <button data-accion="siguiente" style="height: 72px; flex: 1; border: none; border-radius: 999px; background: #F26B0F; font-size: 30px; font-weight: 700; color: #FFFFFF">Enviar</button>
            <button data-accion="siguiente" style="height: 72px; padding: 0 28px; border: none; background: transparent; font-size: 24px; font-weight: 600; color: #FFFFFF; text-decoration: underline">Omitir</button>
          </div>
        </div>
      </div>`;
  } else if (n === 5) {
    html = `${logo(40, 28)}${botonVolver}
      <img class="abs" src="img/productos/04-cafe-con-dona.png" alt="" style="left: 30px; bottom: -60px; height: 640px">
      <div class="abs" style="left: 420px; top: 110px; width: 800px; display: flex; flex-direction: column; gap: 16px">
        <h1 style="margin: 0; font-size: 56px; line-height: 1.05; font-weight: 700; color: #F26B0F">¡Recibe ofertas y descuentos!</h1>
        <p style="margin: 0 0 6px; font-size: 24px; font-weight: 500; color: #7A5A4E">Déjanos tu nombre y correo y te enviaremos promociones exclusivas de Dunkin'.</p>
        <label style="font-size: 20px; font-weight: 600; color: #E8178A">Nombre
          <input id="of-nombre" class="campo" type="text" autocomplete="off" value="${valorOferta(estado, 'nombre')}" style="position: static; display: block; margin-top: 6px; width: 760px; height: 64px; border: 2px solid #D8D2CE; border-radius: 12px"></label>
        <label style="font-size: 20px; font-weight: 600; color: #E8178A">Correo
          <input id="of-email" class="campo" type="email" autocomplete="off" value="${valorOferta(estado, 'email')}" style="position: static; display: block; margin-top: 6px; width: 760px; height: 64px; border: 2px solid #D8D2CE; border-radius: 12px"></label>
        <label style="display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 500; color: #4A2C22">
          <input id="of-acepta" type="checkbox" ${estado.of && estado.of.acepta ? 'checked' : ''} style="width: 30px; height: 30px; accent-color: #E8178A"> Acepto recibir ofertas y promociones de Dunkin' por correo.</label>
        <div style="display: flex; align-items: center; gap: 16px; margin-top: 8px">
          <button data-ofertas="si" style="height: 72px; flex: 1; border: none; border-radius: 999px; background: #E8178A; font-size: 28px; font-weight: 700; color: #FFFFFF">Quiero recibir ofertas</button>
          <button data-ofertas="no" style="height: 72px; padding: 0 28px; border: none; background: transparent; font-size: 24px; font-weight: 600; color: #4A2C22; text-decoration: underline">No, gracias</button>
        </div>
      </div>`;
  } else {
    html = `
      <div class="pantalla" style="background: #CB2F63; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; padding-top: 90px">
        <h1 style="margin: 0; font-size: 130px; line-height: 1; font-weight: 700">¡GRACIAS!</h1>
        <p style="margin: 12px 0 0; font-size: 30px; font-weight: 500">Tu opinión nos ayuda a mejorar cada día</p>
        <div class="abs" style="left: 0; bottom: -50px; width: 1280px; display: flex; justify-content: center; align-items: flex-end; gap: 24px">
          <img src="img/productos/02-cafe-caliente.png" alt="" style="height: 350px">
          <img src="img/productos/04-cafe-con-dona.png" alt="" style="height: 400px">
          <img src="img/productos/01-bebida-rosada.png" alt="" style="height: 380px">
          <img src="img/productos/05-cafe-crema-chocolate.png" alt="" style="height: 360px">
        </div>
        <button data-accion="inicio" class="abs" style="right: 24px; top: 24px; height: 56px; padding: 0 24px; border: 3px solid #FFFFFF; border-radius: 14px; background: transparent; font-size: 22px; font-weight: 700; color: #FFFFFF">INICIO</button>
      </div>`;
    temporizadorGracias = setTimeout(() => { reiniciarEstado(); pintar(); }, (CONFIG.GRACIAS_SEG || 6) * 1000);
  }
  escenario.innerHTML = html + menu;

  escenario.querySelectorAll('[data-cara]').forEach((b) => b.onclick = () => {
    estado.exp = Number(b.dataset.cara);
    estado.reg.experiencia = CARAS[estado.exp];
    estado.sel = {};
    ir(1);
  });
  escenario.querySelectorAll('[data-opcion]').forEach((b) => b.onclick = () => {
    const i = Number(b.dataset.opcion);
    estado.sel[i] = !estado.sel[i];
    b.classList.toggle('sel', estado.sel[i]);
    b.setAttribute('aria-pressed', String(estado.sel[i]));
  });
  escenario.querySelectorAll('[data-tipo]').forEach((b) => b.onclick = () => { estado.reg.tipo_cliente = b.dataset.tipo; ir(2); });
  escenario.querySelectorAll('[data-nps]').forEach((b) => b.onclick = () => { estado.reg.nps = Number(b.dataset.nps); ir(4); });
  conectarOfertas(estado, () => ir(GRACIAS));
  const ta = document.getElementById('comentario');
  if (ta) { ta.oninput = () => { estado.comentario = ta.value; }; setTimeout(() => ta.focus(), 50); }
  escenario.querySelectorAll('[data-accion]').forEach((b) => b.onclick = () => {
    const a = b.dataset.accion;
    if (a === 'volver') volver();
    else if (a === 'siguiente') ir(estado.paso + 1);
    else if (a === 'inicio') { reiniciarEstado(); pintar(); }
  });
}

const inactividad = crearInactividad(() => {
  if (estado.paso > 0 && estado.paso < GRACIAS) terminar(false);
  reiniciarEstado();
  pintar();
});
precargar(['01-bebida-rosada', '02-cafe-caliente', '03-dona-sonrisa', '04-cafe-con-dona', '05-cafe-crema-chocolate'].map((f) => `img/productos/${f}.png`));
reiniciarEstado();
ajustarEscenario();
pintar();
inactividad.reiniciar();
</script>
</body>
</html>
